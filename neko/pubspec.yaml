name: neko
description: Fork editable de NEKO 8.8.2 (ingeniería inversa + assets APK).
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.7.0

dependencies:
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.0
  sqflite: ^2.4.2
  path: ^1.9.1
  google_fonts: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/apk/images/
    - assets/apk/svgs/
    - assets/apk/icon/
  fonts:
    - family: HankenGrotesk
      fonts:
        - asset: assets/apk/fonts/HankenGrotesk-Regular.ttf
        - asset: assets/apk/fonts/HankenGrotesk-Medium.ttf
          weight: 500
        - asset: assets/apk/fonts/HankenGrotesk-SemiBold.ttf
          weight: 600
        - asset: assets/apk/fonts/HankenGrotesk-Bold.ttf
          weight: 700
    - family: SpaceGrotesk
      fonts:
        - asset: assets/apk/fonts/SpaceGrotesk-Regular.ttf
        - asset: assets/apk/fonts/SpaceGrotesk-Medium.ttf
          weight: 500